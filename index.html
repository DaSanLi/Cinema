<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>
</head>

<body>
    <div class="layout">
        <!-- cabecera -->
        <header class="header">
            <div class="logo">
                <div class="play"></div>
            </div>
            <h1 class="title">Mis Pelis</h1>
        </header>
        
        <!-- barra de navegación -->
        <nav class="nav">
            <ul>
                <li><a href="">Inicio</a></li>
                <li><a href="">Peliculas</a></li>
                <li><a href="">Blog</a></li>
                <li><a href="">Contacto</a></li>
            </ul>
        </nav>
        
        
        <!-- aqui iran las Peliculas -->
        <main class="main">
            <section id="content" class="content">
                <article class="peli-items">
                    <h3 class="title">Desarrollo web</h3>
                    <p class="Descripción">Plantilla de prueba</p>
                    <button class="edit">Editar</button>
                    <button class="delete">Borrar</button>
                </article>
            </section>
            
            <aside class="lateral">
                <article class="search">
                    <h3 class="title">Buscador</h3>
                    <form>
                        <input id="input_search" type="text">
                        <button id="btn_search">Buscar</button>
                    </form>
                </article>
                <article class="add">
                    <h3 class="title">Añadir pelicula</h3>
                    <form>
                        <input type="text" id="title" placeholder="Añade una pelicula">
                        <textarea id="descripcion" placeholder="Descripción"></textarea>
                        <button id="save" type="submit">Guardar</button>
                    </form>
                </article>
            </aside>
        </main>
        <footer class="footer">
            &copy; Master en JavaScript ES12 y TypeScript
        </footer>
    </div>
    <script type="module" src="./dist/main.js" ></script>
</body>
</html>
