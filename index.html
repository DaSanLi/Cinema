<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema</title>
</head>

<body>
    <div class="layout">
        <!-- cabecera -->
        <header class="header">
        </header>

        <!-- barra de navegación -->
        <nav class="nav">
            <ul>
                <li>Inicio</li>
                <li>Peliculas</li>
                <li>Blog</li>
                <li>Contacto</li>
            </ul>
        </nav>


        <!-- aqui iran las Peliculas -->
        <main class="content">

            <section>
                <article class="peli-items">
                    <h3 class="title">Desarrollo web</h3>
                    <p class="Descripción">Coloca tu link a linkedin aquí</p>
                </article>
            </section>

            <section class="search">
                <h3 class="title">Buscador</h3>
                <form action="">
                    <input type="text">
                    <button>Buscar</button>
                </form>
            </section>

            <section class="add">
                <h3 class="title">Añadir pelicula</h3>
                <form action="">
                    <input type="text" placeholder="Añade una pelicula">
                    <textarea placeholder="Descripción"></textarea>
                    <input type="submit">
                </form>
            </section>
        </main>
        <footer>
            &copy; Master en JavaScript ES12 y TypeScript
        </footer>
    </div>
